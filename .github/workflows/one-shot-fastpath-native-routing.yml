name: one-shot fast-path native routing

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/NATIVE_FUSION_VALIDATION.md"
      - ".github/workflows/one-shot-fastpath-native-routing.yml"
      - "fast-path/src/main.rs"

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/runtime-speed-v2
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Route fused calls natively and split retry semantics
        shell: python
        run: |
          from pathlib import Path

          path = Path('fast-path/src/main.rs')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              text = text.replace(old, new, 1)

          if 'fn forward_mutating(' not in text:
              replace_once(
                  '            forward(trimmed, &mut upstream, state)?',
                  '            forward_mutating(trimmed, &mut upstream, state)?',
                  'generic mutation forwarding',
              )
              replace_once(
                  '    let response = forward(raw, upstream, state)?;',
                  '    let response = forward_readonly(raw, upstream, state)?;',
                  'read-only observation forwarding',
              )

              start = text.index('fn handle_fused(')
              end = text.index('fn cached(', start)
              replacement = r'''fn handle_fused(
              request: &Value,
              upstream: &mut Upstream,
              state: &Arc<SharedState>,
          ) -> io::Result<String> {
              let arguments = request
                  .get("arguments")
                  .and_then(Value::as_object)
                  .ok_or_else(|| io::Error::new(io::ErrorKind::InvalidInput, "missing arguments"))?;
              let action = arguments
                  .get("actionRequest")
                  .ok_or_else(|| io::Error::new(io::ErrorKind::InvalidInput, "missing actionRequest"))?;
              let observe = arguments
                  .get("observeRequest")
                  .ok_or_else(|| io::Error::new(io::ErrorKind::InvalidInput, "missing observeRequest"))?;

              let native_request = json!({
                  "id": request.get("id").cloned().unwrap_or(Value::Null),
                  "action": "__tempera_act_observe_v1",
                  "actionRequest": action,
                  "observeRequest": observe,
              });
              let native_response =
                  forward_mutating(&native_request.to_string(), upstream, state)?;
              let parsed_native: Value =
                  serde_json::from_str(&native_response).unwrap_or(Value::Null);
              let native_protocol_error = parsed_native
                  .pointer("/data/nativeProtocolError")
                  .and_then(Value::as_bool)
                  == Some(true)
                  || parsed_native
                      .get("error")
                      .and_then(Value::as_str)
                      .is_some_and(|error| error.contains("Unknown action"));

              if !native_protocol_error {
                  let data = parsed_native.get("data").cloned().unwrap_or(Value::Null);
                  return Ok(json!({
                      "schemaVersion": "tempera.browser.fastpath.act-observe/v1",
                      "ok": parsed_native
                          .get("success")
                          .and_then(Value::as_bool)
                          .unwrap_or(false),
                      "action": data.get("action").cloned().unwrap_or(Value::Null),
                      "observation": data
                          .get("observation")
                          .cloned()
                          .unwrap_or(Value::Null),
                      "observationDigest": data
                          .get("observationDigest")
                          .cloned()
                          .unwrap_or(Value::Null),
                      "nativeFused": true,
                  })
                  .to_string());
              }

              // Compatibility only. An old daemon may reject the unknown
              // internal command before any mutation runs. The real action is
              // then sent exactly once; its transport failure is never replayed.
              let action_response = forward_mutating(&action.to_string(), upstream, state)?;
              let parsed_action: Value =
                  serde_json::from_str(&action_response).unwrap_or(Value::Null);
              if parsed_action.get("success").and_then(Value::as_bool) == Some(false)
                  || parsed_action.get("ok").and_then(Value::as_bool) == Some(false)
              {
                  return Ok(json!({
                      "schemaVersion": "tempera.browser.fastpath.act-observe/v1",
                      "ok": false,
                      "action": parsed_action,
                      "observation": null,
                      "nativeFused": false,
                  })
                  .to_string());
              }

              let observation_response =
                  forward_readonly(&observe.to_string(), upstream, state)?;
              let parsed_observation: Value =
                  serde_json::from_str(&observation_response).unwrap_or(Value::Null);
              Ok(json!({
                  "schemaVersion": "tempera.browser.fastpath.act-observe/v1",
                  "ok": parsed_observation
                      .get("success")
                      .or_else(|| parsed_observation.get("ok"))
                      .and_then(Value::as_bool)
                      .unwrap_or(true),
                  "action": parsed_action,
                  "observation": parsed_observation,
                  "nativeFused": false,
              })
              .to_string())
          }

          fn forward_mutating(
              raw: &str,
              upstream: &mut Upstream,
              state: &Arc<SharedState>,
          ) -> io::Result<String> {
              state.stats.forwarded.fetch_add(1, Ordering::Relaxed);
              match upstream.round_trip(raw) {
                  Ok(response) => Ok(response),
                  Err(error) => {
                      // Once bytes may have reached the canonical daemon, retry
                      // would violate at-most-once browser action semantics.
                      upstream.disconnect();
                      Err(io::Error::new(
                          error.kind(),
                          format!(
                              "upstream mutation delivery may be unknown; request was not replayed: {error}"
                          ),
                      ))
                  }
              }
          }

          fn forward_readonly(
              raw: &str,
              upstream: &mut Upstream,
              state: &Arc<SharedState>,
          ) -> io::Result<String> {
              state.stats.forwarded.fetch_add(1, Ordering::Relaxed);
              match upstream.round_trip(raw) {
                  Ok(response) => Ok(response),
                  Err(first) => {
                      state.stats.reconnects.fetch_add(1, Ordering::Relaxed);
                      upstream.disconnect();
                      upstream.round_trip(raw).map_err(|second| {
                          io::Error::new(
                              second.kind(),
                              format!(
                                  "read-only upstream failed after reconnect: first={first}; second={second}"
                              ),
                          )
                      })
                  }
              }
          }

          '''
              text = text[:start] + replacement + text[end:]
              path.write_text(text)
      - name: Validate fast path
        run: |
          cargo fmt --manifest-path fast-path/Cargo.toml
          cargo test --manifest-path fast-path/Cargo.toml --locked
          cargo clippy --manifest-path fast-path/Cargo.toml --all-targets --locked -- -D warnings
          cargo build --manifest-path fast-path/Cargo.toml --release --locked
      - name: Commit validated gateway routing
        shell: bash
        run: |
          set -euo pipefail
          git add fast-path/src/main.rs
          if git diff --cached --quiet; then
            echo 'Native gateway routing already present'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: make browser mutation forwarding at-most-once'
          git fetch origin agent/runtime-speed-v2
          git rebase origin/agent/runtime-speed-v2
          git push origin HEAD:agent/runtime-speed-v2
