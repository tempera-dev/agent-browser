name: one-shot fast MCP Clippy repair

on:
  push:
    branches:
      - agent/fast-control-channel

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fast-control-channel
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply exact lint repair
        shell: python
        run: |
          from pathlib import Path
          path = Path('cli/src/bin/agent-browser-fast-mcp.rs')
          text = path.read_text()
          old = '''        let id = request.get("id").cloned();
                  let method = request.get("method").and_then(Value::as_str)?;
                  if id.is_none() {
                      return None;
                  }
                  let id = id.unwrap_or(Value::Null);'''
          new = '''        let id = request.get("id").cloned()?;
                  let method = request.get("method").and_then(Value::as_str)?;'''
          if old not in text:
              raise SystemExit('expected MCP notification block not found')
          path.write_text(text.replace(old, new, 1))
      - name: Format
        run: cargo fmt --manifest-path cli/Cargo.toml
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git add cli/src/bin/agent-browser-fast-mcp.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: satisfy fast MCP Clippy contract"
          git push origin HEAD:agent/fast-control-channel
