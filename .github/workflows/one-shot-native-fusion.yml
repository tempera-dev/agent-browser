name: one-shot native browser fusion

on:
  push:
    branches:
      - agent/runtime-speed-v2

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/runtime-speed-v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply native daemon fusion
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one anchor in {path}: {old[:120]!r}; found {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          daemon = 'cli/src/native/daemon.rs'
          replace_once(
              daemon,
              'use std::fs;\nuse std::io::Write;\nuse std::path::PathBuf;',
              'use std::fs;\nuse std::hash::{Hash, Hasher};\nuse std::io::Write;\nuse std::path::PathBuf;',
          )
          replace_once(
              daemon,
              '    let mut line = String::new();\n\n    loop {',
              '    let mut line = String::new();\n    // Connection-local observation identity. A reconnect deliberately drops\n    // this state, forcing the caller to receive one full observation before\n    // unchanged deltas can resume.\n    let mut last_observation_digest: Option<String> = None;\n\n    loop {',
          )
          replace_once(
              daemon,
              '''                let response = {
                    let mut s = state.lock().await;
                    execute_command(&cmd, &mut s).await
                };''',
              '''                let response = {
                    let mut s = state.lock().await;
                    execute_connection_command(
                        &cmd,
                        &mut s,
                        &mut last_observation_digest,
                    )
                    .await
                };''',
          )
          insert_anchor = '''fn looks_like_http(line: &str) -> bool {'''
          helper = r'''const NATIVE_ACT_OBSERVE_ACTION: &str = "__tempera_act_observe_v1";
          const NATIVE_SNAPSHOT_DELTA_ACTION: &str = "__tempera_snapshot_delta_v1";
          const NATIVE_FUSION_SCHEMA_V1: &str = "tempera.browser.native-fusion/v1";

          async fn execute_connection_command(
              cmd: &Value,
              state: &mut DaemonState,
              last_observation_digest: &mut Option<String>,
          ) -> Value {
              let action = cmd
                  .get("action")
                  .and_then(Value::as_str)
                  .unwrap_or_default();

              match action {
                  NATIVE_ACT_OBSERVE_ACTION => {
                      native_act_observe(cmd, state, last_observation_digest).await
                  }
                  NATIVE_SNAPSHOT_DELTA_ACTION => {
                      native_snapshot_delta(cmd, state, last_observation_digest).await
                  }
                  _ => {
                      let response = execute_command(cmd, state).await;
                      if is_observation_action(action) {
                          if response_succeeded(&response) {
                              *last_observation_digest = Some(observation_digest(&response));
                          }
                      } else if is_mutating_action(action) {
                          // Never allow a pre-mutation digest to survive the start of
                          // a potentially state-changing command, including commands
                          // that later fail or require confirmation.
                          *last_observation_digest = None;
                      }
                      response
                  }
              }
          }

          async fn native_act_observe(
              cmd: &Value,
              state: &mut DaemonState,
              last_observation_digest: &mut Option<String>,
          ) -> Value {
              let Some(action_request) = cmd.get("actionRequest").filter(|value| value.is_object()) else {
                  return native_protocol_error("act-observe requires object actionRequest");
              };
              let Some(observe_request) = cmd
                  .get("observeRequest")
                  .filter(|value| value.is_object())
              else {
                  return native_protocol_error("act-observe requires object observeRequest");
              };
              let observe_action = observe_request
                  .get("action")
                  .and_then(Value::as_str)
                  .unwrap_or_default();
              if !is_observation_action(observe_action) {
                  return native_protocol_error(
                      "act-observe observeRequest must be an observation command",
                  );
              }

              // Invalidate before executing, not after. Even a confirmation gate or
              // ambiguous failure must not permit a stale pre-action digest to be
              // reused by a subsequent delta request.
              *last_observation_digest = None;
              let started = std::time::Instant::now();
              let action_response = execute_command(action_request, state).await;
              if !response_succeeded(&action_response) {
                  return serde_json::json!({
                      "success": false,
                      "error": "native fused action failed",
                      "data": {
                          "schemaVersion": NATIVE_FUSION_SCHEMA_V1,
                          "action": action_response,
                          "observation": Value::Null,
                          "nativeFused": true,
                          "elapsedMicros": started.elapsed().as_micros(),
                      }
                  });
              }

              let observation = execute_command(observe_request, state).await;
              let observation_success = response_succeeded(&observation);
              let digest = observation_success.then(|| observation_digest(&observation));
              if let Some(ref digest) = digest {
                  *last_observation_digest = Some(digest.clone());
              }

              serde_json::json!({
                  "success": observation_success,
                  "error": if observation_success { Value::Null } else {
                      observation.get("error").cloned().unwrap_or_else(|| Value::String("native fused observation failed".to_string()))
                  },
                  "data": {
                      "schemaVersion": NATIVE_FUSION_SCHEMA_V1,
                      "action": action_response,
                      "observation": observation,
                      "observationDigest": digest,
                      "nativeFused": true,
                      "elapsedMicros": started.elapsed().as_micros(),
                  }
              })
          }

          async fn native_snapshot_delta(
              cmd: &Value,
              state: &mut DaemonState,
              last_observation_digest: &mut Option<String>,
          ) -> Value {
              let Some(observe_request) = cmd
                  .get("observeRequest")
                  .filter(|value| value.is_object())
              else {
                  return native_protocol_error("snapshot-delta requires object observeRequest");
              };
              let observe_action = observe_request
                  .get("action")
                  .and_then(Value::as_str)
                  .unwrap_or_default();
              if !is_observation_action(observe_action) {
                  return native_protocol_error(
                      "snapshot-delta observeRequest must be an observation command",
                  );
              }

              let previous = cmd.get("previousDigest").and_then(Value::as_str);
              let observation = execute_command(observe_request, state).await;
              if !response_succeeded(&observation) {
                  return observation;
              }
              let digest = observation_digest(&observation);
              let unchanged = previous == Some(digest.as_str());
              *last_observation_digest = Some(digest.clone());

              serde_json::json!({
                  "success": true,
                  "data": {
                      "schemaVersion": NATIVE_FUSION_SCHEMA_V1,
                      "unchanged": unchanged,
                      "observationDigest": digest,
                      "observation": if unchanged { Value::Null } else { observation },
                      "connectionDigestMatched": previous.is_some()
                          && previous == last_observation_digest.as_deref(),
                  }
              })
          }

          fn native_protocol_error(message: &str) -> Value {
              serde_json::json!({
                  "success": false,
                  "error": message,
                  "data": {
                      "schemaVersion": NATIVE_FUSION_SCHEMA_V1,
                      "nativeProtocolError": true,
                  }
              })
          }

          fn response_succeeded(response: &Value) -> bool {
              response.get("success").and_then(Value::as_bool) == Some(true)
          }

          fn observation_digest(response: &Value) -> String {
              let mut hasher = std::collections::hash_map::DefaultHasher::new();
              canonical_observation_payload(response).hash(&mut hasher);
              format!("fnv64:{:016x}", hasher.finish())
          }

          fn canonical_observation_payload(response: &Value) -> String {
              // Response IDs are transport correlation, not browser state. Hash only
              // the semantic result/error envelope so equivalent observations from
              // different callers produce the same digest.
              serde_json::to_string(&serde_json::json!({
                  "success": response.get("success"),
                  "data": response.get("data"),
                  "error": response.get("error"),
              }))
              .unwrap_or_default()
          }

          fn is_observation_action(action: &str) -> bool {
              matches!(
                  action,
                  "snapshot" | "url" | "title" | "content" | "read" | "inspect"
              )
          }

          fn is_mutating_action(action: &str) -> bool {
              !action.is_empty()
                  && !is_observation_action(action)
                  && action != "cdp_url"
                  && action != "get_cookies"
          }

          '''
          p = Path(daemon)
          text = p.read_text()
          if text.count(insert_anchor) != 1:
              raise SystemExit('daemon helper insertion anchor missing or ambiguous')
          p.write_text(text.replace(insert_anchor, helper + insert_anchor, 1))

          # Route fast-path fused requests through the new canonical one-command
          # daemon primitive, with compatibility fallback for older daemons.
          fast = 'fast-path/src/main.rs'
          replace_once(
              fast,
              '''    let action_response = forward(&action.to_string(), upstream, state)?;
              let parsed_action: Value = serde_json::from_str(&action_response).unwrap_or(Value::Null);
              if parsed_action.get("ok").and_then(Value::as_bool) == Some(false) {
                  return Ok(json!({
                      "schemaVersion": "tempera.browser.fastpath.act-observe/v1",
                      "ok": false,
                      "action": parsed_action,
                      "observation": null
                  })
                  .to_string());
              }
              let observation_response = forward(&observe.to_string(), upstream, state)?;
              let parsed_observation: Value =
                  serde_json::from_str(&observation_response).unwrap_or(Value::Null);
              Ok(json!({
                  "schemaVersion": "tempera.browser.fastpath.act-observe/v1",
                  "ok": parsed_observation.get("ok").and_then(Value::as_bool).unwrap_or(true),
                  "action": parsed_action,
                  "observation": parsed_observation
              })
              .to_string())''',
              '''    let native_request = json!({
                  "id": request.get("id").cloned().unwrap_or(Value::Null),
                  "action": "__tempera_act_observe_v1",
                  "actionRequest": action,
                  "observeRequest": observe,
              });
              let native_response = forward(&native_request.to_string(), upstream, state)?;
              let parsed_native: Value =
                  serde_json::from_str(&native_response).unwrap_or(Value::Null);
              let native_protocol_error = parsed_native
                  .pointer("/data/nativeProtocolError")
                  .and_then(Value::as_bool)
                  == Some(true)
                  || parsed_native
                      .get("error")
                      .and_then(Value::as_str)
                      .is_some_and(|error| error.contains("Unknown action"));
              if !native_protocol_error {
                  let data = parsed_native.get("data").cloned().unwrap_or(Value::Null);
                  return Ok(json!({
                      "schemaVersion": "tempera.browser.fastpath.act-observe/v1",
                      "ok": parsed_native.get("success").and_then(Value::as_bool).unwrap_or(false),
                      "action": data.get("action").cloned().unwrap_or(Value::Null),
                      "observation": data.get("observation").cloned().unwrap_or(Value::Null),
                      "observationDigest": data.get("observationDigest").cloned().unwrap_or(Value::Null),
                      "nativeFused": true,
                  })
                  .to_string());
              }

              // Compatibility fallback: old daemons do not know the native
              // fusion action, so preserve the existing two-round-trip behavior.
              let action_response = forward(&action.to_string(), upstream, state)?;
              let parsed_action: Value = serde_json::from_str(&action_response).unwrap_or(Value::Null);
              if parsed_action.get("success").and_then(Value::as_bool) == Some(false)
                  || parsed_action.get("ok").and_then(Value::as_bool) == Some(false)
              {
                  return Ok(json!({
                      "schemaVersion": "tempera.browser.fastpath.act-observe/v1",
                      "ok": false,
                      "action": parsed_action,
                      "observation": null,
                      "nativeFused": false,
                  })
                  .to_string());
              }
              let observation_response = forward(&observe.to_string(), upstream, state)?;
              let parsed_observation: Value =
                  serde_json::from_str(&observation_response).unwrap_or(Value::Null);
              Ok(json!({
                  "schemaVersion": "tempera.browser.fastpath.act-observe/v1",
                  "ok": parsed_observation
                      .get("success")
                      .or_else(|| parsed_observation.get("ok"))
                      .and_then(Value::as_bool)
                      .unwrap_or(true),
                  "action": parsed_action,
                  "observation": parsed_observation,
                  "nativeFused": false,
              })
              .to_string())''',
          )

          docs = Path('docs/PERFORMANCE_V2.md')
          docs_text = docs.read_text()
          docs_text += r'''

          ## Native daemon fusion

          The canonical daemon now understands two internal, versioned hot-path commands:

          - `__tempera_act_observe_v1`: executes one existing canonical action followed by one existing observation while holding the daemon state lock once. Policy, confirmations, action semantics, and snapshot construction remain owned by the canonical handlers.
          - `__tempera_snapshot_delta_v1`: returns an observation digest and omits the full observation payload when the caller's previous digest matches.

          The digest deliberately excludes request correlation IDs. It is a transport optimization fingerprint, not a security hash or an authority token. A reconnect loses connection-local digest history and therefore forces a full observation before delta operation resumes.

          Mutation invalidation happens before a potentially mutating command executes. Ambiguous failures and confirmation-gated commands therefore cannot preserve a pre-action digest. The native fused command is never retried after uncertain delivery by the fast-path layer.
          '''
          docs.write_text(docs_text)
      - name: Format and validate
        run: |
          cargo fmt --manifest-path cli/Cargo.toml -- --check
          cargo clippy --manifest-path cli/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path cli/Cargo.toml
          cargo fmt --manifest-path fast-path/Cargo.toml -- --check
          cargo clippy --manifest-path fast-path/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path fast-path/Cargo.toml
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git add cli/src/native/daemon.rs fast-path/src/main.rs docs/PERFORMANCE_V2.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: fuse daemon action and observation'
          git push origin HEAD:agent/runtime-speed-v2
