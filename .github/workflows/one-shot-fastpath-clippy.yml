name: one-shot fast-path strict Clippy repair

on:
  push:
    branches:
      - agent/runtime-speed-v2

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/runtime-speed-v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply exact lint fix
        shell: python
        run: |
          from pathlib import Path
          path = Path('fast-path/src/main.rs')
          text = path.read_text()
          old = 'if max_line_bytes < 1024 || max_line_bytes > 64 * 1024 * 1024 {'
          new = 'if !(1024..=64 * 1024 * 1024).contains(&max_line_bytes) {'
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('expected max_line_bytes validation not found')
      - name: Validate
        run: |
          cargo fmt --manifest-path fast-path/Cargo.toml
          cargo test --manifest-path fast-path/Cargo.toml --locked
          cargo clippy --manifest-path fast-path/Cargo.toml --all-targets --locked -- -D warnings
      - name: Commit lint repair
        shell: bash
        run: |
          set -euo pipefail
          git add fast-path/src/main.rs
          if git diff --cached --quiet; then
            echo 'Lint already repaired'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: satisfy strict fast-path Clippy'
          git push origin HEAD:agent/runtime-speed-v2
