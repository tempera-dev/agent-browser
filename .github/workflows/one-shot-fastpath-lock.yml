name: one-shot fast-path lockfile

on:
  push:
    branches:
      - agent/runtime-speed-v2

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/runtime-speed-v2
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate lockfile
        run: cargo generate-lockfile --manifest-path fast-path/Cargo.toml
      - name: Verify locked tests
        run: cargo test --manifest-path fast-path/Cargo.toml --locked
      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          git add fast-path/Cargo.lock
          if git diff --cached --quiet; then
            echo 'Lockfile already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: lock browser fast-path dependencies'
          git push origin HEAD:agent/runtime-speed-v2
